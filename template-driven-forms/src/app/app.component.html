<h1>Registration Form</h1>
<form #userForm="ngForm" (ngSubmit)="this.onSubmit(userForm)">

  <label for="userName">Name :- </label>
  <input type="text" name="username" ngModel id="userName"/>

  <br><br>
  <label for="userPassword">Email :- </label>
  <input type="password" name="password" ngModel id="userPassword"/>

  <br><br>
  <button type="submit">Submit</button>

</form>
